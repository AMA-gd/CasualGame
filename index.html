<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Презентация CasualGame</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; text-align: center; padding: 40px 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; background: #161b22; padding: 40px 30px; border-radius: 16px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        h1 { color: #f0f6fc; font-size: 28px; margin-bottom: 30px; }
        
        /* Блок для каждой игры */
        .game-section { margin-bottom: 40px; text-align: center; }
        
        /* Плеер сохраняет свои пропорции и не растягивается насильно */
        video { width: 100%; max-width: 100%; height: auto; border-radius: 12px; border: 1px solid #30363d; background: #000; display: block; margin: 0 auto; }
        
        /* Стиль для текста и ссылки */
        .game-link-block { margin-top: 30px; font-size: 16px; color: #8b949e; }
        .game-link { color: #58a6ff; text-decoration: none; font-weight: 500; }
        .game-link:hover { text-decoration: underline; }
        
        /* Разделительная линия с отступом */
        .divider { height: 1px; background-color: #30363d; border: none; margin: 40px 0 20px 0; }
        /* Удаляем разделитель у самого последнего блока */
        .game-section:last-child .divider { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Презентация игр CasualGame</h1>

        <!-- ================= БЛОК ИГРЫ №1 ================= -->
<div class="game-section">
    <!-- Видео со сдвигом на 1 секунду для отображения первого кадра -->
    <video src="https://github.com" controls preload="auto"></video>
    
    <!-- Текст и ссылка после видео с правильным CSS-классом -->
    <div class="game-link-block">
        Ссылка на игру: <a href="https://devarm.itch.io/dotty" target="_blank" class="game-link">https://devarm.itch.io/dotty</a>
    </div>
    
    <!-- Разделительная линия -->
    <hr class="divider">
</div>


        <!-- ================= БЛОК ИГРЫ №2 (Пример для копирования) ================= -->
        <div class="game-section">
            <!-- Видео -->
            <video src="https://github.com/AMA-gd/CasualGame/releases/download/v1.0/compressed_2.mp4" controls preload="metadata"></video>
            
            <!-- Текст и ссылка -->
            <div class="game-link-block">
                Ссылка на игру: <a href="https://devarm.itch.io/magicpuzzle" target="_blank" class="game-link">Magic Puzzle</a>
            </div>
            
            <!-- Разделительная линия -->
            <hr class="divider">
        </div>

    </div>
</body>
</html>
